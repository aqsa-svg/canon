# Free-tier provider configuration.
#
# The whole benchmark must be reproducible for $0, so these ceilings are not operational
# trivia -- they determine what can be measured at all. At roughly 23k tokens a question,
# a 200,000 token/day budget is about eight questions per system per day. The sweep plan
# in RESULTS.md follows from these numbers.
#
# `verified: false` means the figure was taken from the provider's documentation as of
# writing but has NOT been re-checked on this machine. Free-tier limits change without
# notice, so the dry-run labels any projection built on unverified limits rather than
# presenting it as fact. Check and flip the flag before quoting a wall-clock estimate.
#
# `temperature: 0.0` wherever the provider accepts it. Determinism is not achievable via
# sampling on every backend -- current Anthropic models reject the parameter outright --
# so reproducibility comes from the response cache. Setting it where possible costs
# nothing and removes one source of drift.

groq:
  name: groq
  model_id: openai/gpt-oss-120b
  context_limit: 131072
  max_output_tokens: 8192
  temperature: 0.0
  reasoning_effort: medium
  notes: >-
    Primary provider. Structured output via tool-calling, because this model exposes
    function calling rather than a native JSON-schema response mode. Tokenised locally
    with tiktoken's o200k_harmony encoding, which is the GPT-OSS harmony tokenizer, so
    the dry-run token counts for this provider are exact rather than estimated.
  limits:
    requests_per_minute: 30
    tokens_per_minute: 8000
    requests_per_day: 1000
    tokens_per_day: 200000
    source: >-
      MIXED PROVENANCE -- read the two claims separately, because only one of them is
      actually verified.

      tokens_per_minute = 8000 is PROVIDER-CONFIRMED. Groq refused a call on 2026-09-08
      during run tag sweep-groq-r1 (question am-08) and quoted its own limit verbatim:
      "Request too large for model openai/gpt-oss-120b in organization ... service tier
      on_demand on tokens per minute (TPM): Limit 8000, Requested 8092". The full error
      is preserved in benchmark/runs/sweep-groq-r1/checkpoint.jsonl under am-08. A
      provider quoting its own ceiling while enforcing it is the strongest evidence
      available short of reading the dashboard.

      tokens_per_day = 200000 is NOT verified; it is a FLOOR. On 2026-09-04, run tag
      sweep-groq-r1 consumed 199,516 tokens across 95 requests in one UTC day with zero
      quota refusals, so the real daily cap is >= 199,516. It is not confirmed to be
      exactly 200,000: both "exhaustion" events were this project's own limiter refusing
      pre-emptively because config said 200,000, never Groq refusing. Treating that as
      verification would verify the config against itself. What would actually verify it
      is a 429 or a tokens-per-day rate_limit_exceeded from Groq, which has not happened
      -- by design, since the limiter stops first.

      requests_per_minute and requests_per_day remain unverified: neither has been
      approached, let alone hit.
    verified: false
    verified_note: >-
      tokens_per_minute: verified by provider refusal (2026-09-08, am-08).
      tokens_per_day: floor of 199,516 observed 2026-09-04; exact cap unverified.
      requests_*: never approached.

gemini:
  name: gemini
  model_id: gemini-2.5-flash
  context_limit: 1048576
  max_output_tokens: 8192
  temperature: 0.0
  notes: >-
    Second provider, used for the cross-model robustness check rather than the headline.
    Uses native response_schema structured output, so the schema is enforced by the API
    rather than by prompt instruction. NOTE ON DATA POLICY: Google's free tier may use
    submitted prompts and responses to improve their products. The warehouse is a public
    dataset and the questions are synthetic, so nothing confidential is at stake here --
    but this is why Gemini is the secondary provider and why the README says so plainly.
    Token counts for this provider are APPROXIMATE: there is no local tokenizer, so the
    dry-run uses o200k_base as a proxy and labels the figure.
  limits:
    requests_per_minute: 10
    tokens_per_minute: 250000
    requests_per_day: 250
    tokens_per_day: null
    source: >-
      UNVERIFIED, and more weakly sourced than the Groq figures. Google AI Studio free
      tier for the current Flash model, from provider docs at time of writing. Google no
      longer publishes these consistently and the dashboard is only visible to the signed
      in account holder, which this process cannot read. Free-tier quotas for Gemini have
      changed repeatedly; re-check before quoting.

      No figure here has been confirmed by Google refusing a call and quoting its own
      ceiling, which is the only evidence this project accepts for verified: true. The
      limiter therefore treats these as a planning estimate, not a contract, and the run
      records any limit the provider quotes while enforcing it -- the same route by which
      Groq's tokens_per_minute became provider-confirmed.

      Note the limit SHAPE differs from Groq's: Gemini free tier is bounded by requests
      per day rather than tokens per day, so the binding constraint on a sweep is the
      call count, not the prompt size. A two-stage strategy that halves tokens but adds
      a call is therefore WORSE here, not better -- the opposite of the Groq trade-off.
    verified: false

anthropic:
  name: anthropic
  model_id: claude-opus-5
  context_limit: 1000000
  max_output_tokens: 8192
  temperature: null
  reasoning_effort: medium
  notes: >-
    Retained so the paid path can be swapped back in unchanged, and so the earlier
    design is not lost. NOT free tier: every call is billed, which is why it is not the
    default. Current Anthropic models reject `temperature`, hence null.
  limits:
    requests_per_minute: 50
    tokens_per_minute: 40000
    requests_per_day: null
    tokens_per_day: null
    source: Paid-tier limits vary by account; these are placeholders and not a free tier.
    verified: false
